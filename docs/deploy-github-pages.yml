# =============================================================
# DEPLOY GITHUB PAGES — CETI Sebastião Soares Ribeiro (SSR-Connect)
#
# IMPORTANTE: a plataforma Base44 não permite gravar arquivos em
# .github/workflows/, então este arquivo fica aqui como modelo.
#
# COMO ATIVAR (uma única vez, direto no site do GitHub):
#   1. No repositório: "Add file" > "Create new file"
#   2. Nome do arquivo: .github/workflows/deploy.yml
#   3. Cole TODO o conteúdo deste arquivo e salve ("Commit changes")
#   4. Em "Settings" > "Secrets and variables" > "Actions" > "New repository secret":
#        Name:  VITE_BASE44_APP_ID
#        Value: o ID do app (está na URL do editor Base44, entre "/apps/" e "/editor/")
#   5. Em "Settings" > "Pages" > "Build and deployment" > "Source": escolha "GitHub Actions"
#   6. Rode manualmente: aba "Actions" > "Deploy GitHub Pages" > "Run workflow"
#      (e depois roda sozinho a cada push na branch principal)
# =============================================================

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Ativa o caminho "/SSR-CONNECT/" exigido pelo GitHub Pages
          DEPLOY_TARGET: github
          # Identifica o app no backend Base44 (configure o secret no passo 4)
          VITE_BASE44_APP_ID: ${{ secrets.VITE_BASE44_APP_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4