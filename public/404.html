<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>CETI Sebastião Soares Ribeiro</title>
    <script>
      // GitHub Pages (SPA): quando um link direto (ex.: /admin ou /login) não
      // existe como arquivo físico, o GitHub serve esta página. Ela guarda a
      // rota original na sessão e volta para a raiz do site, onde o index.html
      // restaura a rota no histórico e o React Router abre a tela certa.
      (function () {
        var base = window.location.pathname.indexOf("/SSR-CONNECT") === 0 ? "/SSR-CONNECT" : "";
        try {
          sessionStorage.redirect = window.location.pathname + window.location.search + window.location.hash;
        } catch (e) {}
        window.location.replace(base + "/");
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando…</p>
  </body>
</html>
